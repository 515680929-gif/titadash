name: Build IPA (一键打包)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出仓库（含 zip 源码）
        uses: actions/checkout@v4

      - name: 解压源码
        run: |
          unzip -o TitaDashboard.zip -d src
          cp -r src/TitaDashboard/. .

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project TitaDashboard.xcodeproj \
            -scheme TitaDashboard \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/TitaDashboard.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 打包 IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/TitaDashboard.xcarchive/Products/Applications/TitaDashboard.app" build/Payload/
          cd build && zip -qr TitaDashboard-unsigned.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: TitaDashboard-unsigned-ipa
          path: build/TitaDashboard-unsigned.ipa
          retention-days: 30
