name: Unpack Project
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压 zip 并铺平到仓库根目录
        run: |
          unzip -o TitaDashboard.zip -d unpack_tmp
          cp -r unpack_tmp/TitaDashboard/. .
          rm -rf unpack_tmp TitaDashboard.zip

      - name: 提交回仓库
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project files"
          git push
